[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kodi-library"
version = "0.1.0"
description = "Independent Kodi and physical movie catalogue with a versioned API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymysql[rsa]>=1.1,<2",
  "httpx>=0.27,<1", "aiohttp>=3.12,<4", "defusedxml>=0.7,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
browser = ["playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["kodi_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
