name: Format memc tests (temporary)
on:
  push:
    branches: [memc]
    paths:
      - '.github/workflows/format-memc-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memc
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.12,<1'
      - run: |
          ruff check --fix kodi_library tests || true
          ruff format kodi_library tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kodi_library tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: format final playback cloud tests'
            git push origin HEAD:memc
          fi
